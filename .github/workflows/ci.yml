name: CI Pipeline

on:
  push:
    branches:
      - main
      - devops-upgrade

  pull_request:
    branches:
      - main

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile backend/main.py
          python -m py_compile backend/database.py
          python -m py_compile backend/models.py
          python -m py_compile backend/detector.py
          python -m py_compile backend/simulator.py

      - name: Build backend Docker image
        run: |
          docker build -f backend/Dockerfile -t industrial-monitoring-api .

      - name: Validate Docker Compose configuration
        run: |
          docker compose -f infra/docker-compose.yml config